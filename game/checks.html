<!doctype html><meta charset="utf-8"><title>Night Shift campaign checks</title><style>body{font:14px monospace;background:#181b19;color:#e5dec5}pre{white-space:pre-wrap}iframe{width:1200px;height:900px}</style><h1>24-job campaign regression</h1><pre id="out">Running…</pre><iframe id="game"></iframe><script>
(async()=>{const out=document.querySelector('#out'),f=document.querySelector('#game');let lines=[];function check(name,ok){lines.push((ok?'PASS ':'FAIL ')+name);out.textContent=lines.join('\n');if(!ok)throw Error(name);}let source=await(await fetch('index.html',{cache:'no-store'})).text();f.srcdoc=source.replace("'use strict';","'use strict'; window.requestAnimationFrame=fn=>window.tickFrame=fn;");await new Promise(r=>f.onload=r);let w=f.contentWindow,A=w.WrongButton,d=w.document;

s=A.step(s,A.DT);acc-=A.DT;
}}

let snapshots=[];for(let i=0;i<A.LEVELS.length;i++){let runs=[30,60,120].map(fps=>solve(i,fps));check(String(i+1).padStart(2,'0')+' '+A.LEVELS[i].name+' full delivery'+(A.LEVELS[i].park?' + parking':''),runs.every(r=>r.s.complete));let times=runs.map(r=>r.s.time);check('  30/60/120 repeatability '+times.map(t=>t.toFixed(2)).join('/'),Math.max(...times)-Math.min(...times)<.02);snapshots.push({level:i,time:times[0],actions:runs[0].s.actions});}

s=A.initial(12);s.cargo[0]={...s.cargo[0],x:780,y:48};for(let i=0;i<240;i++)s=A.step(s,A.DT);check('unstamped delivery rejected',!s.complete&&!s.cargo[0].done);
s={...A.initial(19),power:true,brake:true};s.cargo[0]={...s.cargo[0],x:170,y:0};for(let i=0;i<240;i++)s=A.step(s,A.DT);check('wrong letter bay rejected',!s.cargo[0].done);
s=A.initial(18);s.cargo[0].done=true;s.vehicleX=130;s.power=true;for(let i=0;i<240;i++)s=A.step(s,A.DT);check('parking requires engine off',!s.complete);s.power=false;for(let i=0;i<240;i++)s=A.step(s,A.DT);check('correct parking completes job',s.complete);
s=A.initial(0);s.cargo[0]={...s.cargo[0],x:777,y:100,supported:'forks'};s.held=0;s.vehicleX=777;s.forkHeight=52;for(let i=0;i<240;i++)s=A.step(s,A.DT);check('hovering over matching bay never completes',!s.complete);
s=A.initial(12);s.cargo[0].x=450;for(let i=0;i<240;i++)s=A.step(s,A.DT);check('inspection needs power',!s.cargo[0].scanned);s.power=true;s.brake=false;for(let i=0;i<240;i++)s=A.step(s,A.DT);check('inspection needs brake',!s.cargo[0].scanned);s.brake=true;for(let i=0;i<180;i++)s=A.step(s,A.DT);check('station stamps after stable powered braking',s.cargo[0].scanned);
for(let i=0;i<24;i++){let a=A.initial(i),b=A.initial(i);check('job '+(i+1)+' reset restores independent cargo',a.cargo!==b.cargo&&a.held===null&&!a.gateOpen&&a.cargo.every(c=>!c.done));}
// Replay a complete real DOM control route through the runtime, including next/retry/board.
let click=id=>d.getElementById(id).click(),key=k=>d.body.dispatchEvent(new w.KeyboardEvent('keydown',{key:k,bubbles:true}));click('primary');click('jobsButton');d.querySelector('.job-card').click();let now=1000;
for(let index=0;index<24;index++){let timeline=solve(index).trace,n=0;for(let tick=0;tick<20000&&A.mode!=='result';tick++){while(n<timeline.length&&timeline[n][0]<=A.state.time+.00001){let [,type,v]=timeline[n++];if(type==='lift')d.body.dispatchEvent(new w.KeyboardEvent(v?'keydown':'keyup',{key:' ',bubbles:true}));else key(({power:'1',brake:'3',horn:'2'})[type]||({[-1]:'ArrowLeft',0:'ArrowDown',1:'ArrowRight'})[v]);}now+=1000/120;w.tickFrame(now);}check('DOM keyboard job '+(index+1)+' reaches result',A.mode==='result'&&A.state.level===index);if(index<23){click('primary');check('next advances to job '+(index+2),A.state.level===index+1&&A.mode==='play');}await new Promise(r=>setTimeout(r,0));}
check('final result offers job board',d.getElementById('primary').textContent==='Job board');click('primary');check('all 24 results marked complete',d.querySelectorAll('.job-card.done').length===24);click('closeJobs');check('closing board restores final result',A.mode==='result'&&d.getElementById('modal').open);click('retry');check('final job can be replayed cleanly',A.state.level===23&&A.mode==='play'&&!A.state.complete);click('jobsButton');check('board has 24 available jobs',d.querySelectorAll('.job-card').length===24);d.querySelectorAll('.job-card')[23].click();check('board can jump to final job',A.state.level===23);key(' ');w.dispatchEvent(new w.Event('blur'));check('focus loss clears hold and pauses',!A.state.lift&&A.mode==='pause');click('primary');let before=JSON.stringify(A.state);d.getElementById('notes').dispatchEvent(new w.KeyboardEvent('keydown',{key:'1',bubbles:true}));check('notes typing isolated',JSON.stringify(A.state)===before);
