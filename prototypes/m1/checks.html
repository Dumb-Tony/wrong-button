<!doctype html><meta charset="utf-8"><title>Wrong Button regression checks</title><style>body{background:#182824;color:#e8e8ce;font:16px monospace}iframe{width:1200px;height:900px}pre{white-space:pre-wrap}</style><h1>M1 automated regression runner</h1><pre id="out">Running…</pre><iframe id="game"></iframe><script>
(async()=>{let results=[];const check=(name,ok)=>{results.push((ok?'PASS ':'FAIL ')+name);document.querySelector('#out').textContent=results.join('\n');if(!ok)throw Error(name);};
let html=await (await fetch('index.html')).text();let f=document.querySelector('iframe');f.srcdoc=html.replace("'use strict';","'use strict'; window.requestAnimationFrame=fn=>window.tickFrame=fn;");await new Promise(r=>f.onload=r);let w=f.contentWindow,d=w.document,A=w.WrongButton;
let advance=(seconds)=>{for(let i=0;i<Math.ceil(seconds*120);i++){w.testNow=(w.testNow||1000)+1000/120;w.tickFrame(w.testNow);}};
let click=id=>d.getElementById(id).click();let key=(id,k,type='keydown')=>d.getElementById(id).dispatchEvent(new w.KeyboardEvent(type,{key:k,bubbles:true}));let lever=v=>{d.getElementById('drive').value=v;d.getElementById('drive').dispatchEvent(new w.Event('input'));};
click('primary');check('start enters play',A.mode==='play');click('horn');lever(1);key('lift',' ');advance(2);check('all actuators denied without power',A.state.vehicleX===130&&A.state.forkHeight===0);key('lift',' ','keyup');click('power');advance(1);check('brake blocks powered drive',A.state.vehicleX===130);click('brake');advance(1);click('brake');let stop=A.state.vehicleX;advance(1);check('brake immediately stops moving machine',A.state.vehicleX===stop);
const reset=()=>{click('reset');click('primary');};reset();d.getElementById('notes').value='Test observation';d.getElementById('notes').dispatchEvent(new w.Event('input'));for(let i=0;i<20;i++)reset();check('20 resets preserve mapping and notes',JSON.stringify(A.MAP)==='{"power":"upper-left","horn":"upper-right","brake":"lower-left","drive":"right-lever","lift":"bottom"}'&&d.getElementById('notes').value==='Test observation');
// Complete route through keyboard handlers. Spatial neutral descriptions remain unchanged.
key('power','Enter');key('power','Enter','keyup'); // Synthetic key events do not synthesize native button clicks; click below models native activation.
click('power');click('brake');lever(1);advance(1.6);lever(0);key('lift',' ');advance(1.4);check('crate acquired',A.state.loadSupported==='forks');lever(1);advance(4.5);lever(0);key('lift',' ','keyup');advance(4);check('full route settles in result',A.mode==='result');results.push('Route time '+A.state.time.toFixed(3)+'s');click('primary');check('result restart clears machine',A.mode==='play'&&A.state.vehicleX===130);
key('lift',' ');w.dispatchEvent(new w.Event('blur'));check('focus loss pauses and clears held input',A.mode==='pause'&&!A.state.lift);let t=A.state.time;advance(50);check('pause discards suspended time',A.state.time===t);click('primary');advance(.1);check('resume has no backlog',A.state.time<1);
function run(fps){let s=A.initial(),acc=0;for(let frame=0;frame<fps*20&&!s.complete;frame++){acc+=1/fps;while(acc+1e-10>=A.DT){let t=s.time;s={...s,power:true,brake:false,drive:t<1.6?1:t<3?0:t<7.5?1:0,lift:t>=1.6&&t<7.5};s=A.step(s,A.DT);acc-=A.DT;}}return s;}
let runs=[30,60,120].map(run);check('30/60/120 FPS routes complete within 2%',runs.every(s=>s.complete)&&Math.max(...runs.map(s=>s.time))-Math.min(...runs.map(s=>s.time))<runs[0].time*.02);results.push('FPS times '+runs.map(s=>s.time.toFixed(4)).join(', '));
for(let side of [-1,1]){let s={...A.initial(),power:true,lift:true,vehicleX:330+side*60};for(let i=0;i<120;i++)s=A.step(s,A.DT);check('ground recovery from '+(side<0?'left':'right'),s.loadSupported==='forks');}
let fly={...A.initial(),power:true,lift:true,vehicleX:770,forkHeight:100,loadPose:{x:770,y:148},loadSupported:'forks'};for(let i=0;i<240;i++)fly=A.step(fly,A.DT);check('passing or hovering in bay cannot win',!fly.complete&&fly.stable===0);
let edge={...A.initial(),power:true,brake:false,drive:1};for(let i=0;i<120*3600;i++)edge=A.step(edge,A.DT);check('one-hour simulation bounded and finite',edge.vehicleX===810&&Number.isFinite(edge.time)&&edge.forkHeight>=0);
check('source self-contained',!/<script[^>]+src=|<link[^>]+href=|fetch\(/.test(html));
f.srcdoc=html.replace("'use strict';","'use strict'; Object.defineProperty(window,'localStorage',{get(){throw Error('blocked storage')}}); window.requestAnimationFrame=fn=>window.tickFrame=fn;");await new Promise(r=>f.onload=r);w=f.contentWindow;d=w.document;A=w.WrongButton;click('primary');d.getElementById('notes').value='Memory only';d.getElementById('notes').dispatchEvent(new w.Event('input'));reset();check('blocked storage remains playable; notes survive reset',A.mode==='play'&&d.getElementById('notes').value==='Memory only'&&d.getElementById('storage').textContent.includes('unavailable'));
document.querySelector('#out').textContent=results.join('\n')+'\nDONE';
})().catch(e=>document.querySelector('#out').textContent+='\nERROR '+e.stack);
</script>
